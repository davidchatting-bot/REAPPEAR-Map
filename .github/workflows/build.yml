name: Build TheMap.jar

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

env:
  PROCESSING_VERSION: 3.5.4
  PROCESSING_TAG: processing-0270-3.5.4
  ANI_REF: master

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out TheMap
        uses: actions/checkout@v4

      - name: Set up JDK 11
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '11'

      - name: Cache Processing download
        id: cache-processing
        uses: actions/cache@v4
        with:
          path: processing-${{ env.PROCESSING_VERSION }}
          key: processing-${{ env.PROCESSING_VERSION }}-linux64

      # core.jar, jogl-all.jar and gluegen-rt.jar (the pure-Java API jars)
      # come from here. The ARM-specific *-natives-linux-armv6hf.jar files
      # are a runtime-only dependency of JOGL's native library loader that
      # no official Processing release includes (Processing dropped Linux
      # ARM builds before 3.5.4); they're fetched separately from Maven
      # Central by tools/fetch-natives.sh, below.
      - name: Download Processing ${{ env.PROCESSING_VERSION }}
        if: steps.cache-processing.outputs.cache-hit != 'true'
        run: |
          curl -fL -o processing.tgz \
            "https://github.com/processing/processing/releases/download/${{ env.PROCESSING_TAG }}/processing-${{ env.PROCESSING_VERSION }}-linux64.tgz"
          mkdir -p processing-${{ env.PROCESSING_VERSION }}
          tar xzf processing.tgz -C processing-${{ env.PROCESSING_VERSION }} --strip-components=1
          rm processing.tgz

      - name: Check out Ani
        uses: actions/checkout@v4
        with:
          repository: b-g/Ani
          ref: ${{ env.ANI_REF }}
          path: Ani

      - name: Build Ani.jar from source
        run: |
          mkdir -p Ani_classes
          find Ani/src -name '*.java' > Ani_sources.txt
          # Ani's source files are Latin-1 (degree signs, accented names in
          # comments/headers), not UTF-8 - javac's default encoding assumption
          # otherwise fails with "unmappable character" errors.
          javac -encoding ISO-8859-1 -cp "processing-${{ env.PROCESSING_VERSION }}/core/library/core.jar" \
            -d Ani_classes @Ani_sources.txt
          jar --create --file=Ani.jar -C Ani_classes .

      # Runs the same build.sh a person runs locally, so CI exercises the real
      # build path (including tools/pde2java.py, which generates
      # build/TheMap.java from source/*.pde) rather than a copy of it. Only
      # core.jar and Ani.jar are needed to compile; JOGL and GlueGen are
      # copied into lib/ too because the Pi bundle below includes them.
      - name: Build TheMap.jar
        run: |
          mkdir -p lib
          cp "processing-${{ env.PROCESSING_VERSION }}/core/library/core.jar" lib/
          cp "processing-${{ env.PROCESSING_VERSION }}/core/library/jogl-all.jar" lib/
          cp "processing-${{ env.PROCESSING_VERSION }}/core/library/gluegen-rt.jar" lib/
          cp Ani.jar lib/
          ./build.sh

      - name: Upload TheMap.jar
        uses: actions/upload-artifact@v4
        with:
          name: TheMap.jar
          path: lib/TheMap.jar

      # Two bundles with the same layout as the launcher script expects.
      # TheMap has only what isn't platform-specific - the sketch, Processing
      # core and Ani - so JOGL and GlueGen (the OpenGL layer behind P3D, whose
      # jars come paired with per-platform natives) are left for the platform
      # to supply in lib/; the launcher picks up whatever jars are there.
      # TheMap-linux-armv6hf is that same bundle plus JOGL, GlueGen and their
      # Raspberry Pi natives, ready to run. config.properties itself is
      # deliberately NOT included - only the .example template, same as the
      # repo - since it holds real credentials on a real device.
      - name: Assemble bundles
        run: |
          mkdir -p dist/TheMap/lib dist/TheMap/data
          cp lib/TheMap.jar lib/core.jar lib/Ani.jar dist/TheMap/lib/
          cp TheMap config.properties.example dist/TheMap/
          chmod +x dist/TheMap/TheMap
          cp data/eqcy_600.png dist/TheMap/data/
          tar czf TheMap.tar.gz -C dist TheMap

          cp -r dist/TheMap dist/TheMap-linux-armv6hf
          cp lib/jogl-all.jar lib/gluegen-rt.jar dist/TheMap-linux-armv6hf/lib/
          ./tools/fetch-natives.sh dist/TheMap-linux-armv6hf/lib
          tar czf TheMap-linux-armv6hf.tar.gz -C dist TheMap-linux-armv6hf

      - name: Upload TheMap bundle
        uses: actions/upload-artifact@v4
        with:
          name: TheMap
          path: TheMap.tar.gz

      - name: Upload linux-armv6hf runtime bundle
        uses: actions/upload-artifact@v4
        with:
          name: TheMap-linux-armv6hf
          path: TheMap-linux-armv6hf.tar.gz

  # A single rolling release, always tagged `latest`, replaced on every push
  # to master - so the download URL never changes and there are no versions to
  # manage. Deleted and recreated rather than edited in place, which is what
  # moves the `latest` tag to the new commit. Kept as its own job so the build
  # job (which runs code from pull requests too) never holds write access.
  release:
    needs: build
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: rolling-release
      cancel-in-progress: false
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Download TheMap bundle
        uses: actions/download-artifact@v4
        with:
          name: TheMap
          path: dist

      - name: Download linux-armv6hf bundle
        uses: actions/download-artifact@v4
        with:
          name: TheMap-linux-armv6hf
          path: dist

      - name: Publish rolling latest release
        run: |
          if gh release view latest --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release delete latest --repo "$GITHUB_REPOSITORY" --cleanup-tag --yes
          fi
          cat > notes.md <<EOF
          Automatically built from ${GITHUB_SHA::7} ([commit](https://github.com/${GITHUB_REPOSITORY}/commit/${GITHUB_SHA})), replaced on every push to master.

          - \`TheMap-linux-armv6hf.tar.gz\` - ready to run on a Raspberry Pi, with JOGL, GlueGen and their Raspberry Pi native libraries included. Extract, copy \`config.properties.example\` to \`config.properties\` and fill in real values, then run \`./TheMap\`.
          - \`TheMap.tar.gz\` - for any other platform: just the sketch, Processing core and Ani. Before running, add JOGL and GlueGen 2.3.2 for your platform to \`lib/\` (the \`jogl-all\` and \`gluegen-rt\` jars plus their natives jars, from Maven Central). Only the Raspberry Pi has been tested.

          See the README for details.
          EOF
          gh release create latest dist/TheMap.tar.gz dist/TheMap-linux-armv6hf.tar.gz \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "Latest build" \
            --notes-file notes.md
